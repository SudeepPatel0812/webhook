# Single-binary Tempo for local use: receives OTLP over HTTP, stores traces on
# local disk, and serves the query API Grafana reads from.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Defaults are sized for a small shared tenant: 10,000 traces held in memory at
# once and 15MB/s. A load test opens tens of thousands of traces a second, and
# past the limit Tempo silently discards spans (live_traces_exceeded).
overrides:
  defaults:
    ingestion:
      max_traces_per_user: 200000
      rate_limit_bytes: 60000000
      burst_size_bytes: 90000000

